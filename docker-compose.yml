services:
  popg-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - OLLAMA_URL=http://host-gateway:11434
      - OLLAMA_MODEL=llama3
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cuda
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
